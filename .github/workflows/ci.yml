name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build for testing
        run: >-
          xcodebuild
          -project Downleaf.xcodeproj
          -scheme Downleaf
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DownleafDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run tests
        run: >-
          xcodebuild
          -project Downleaf.xcodeproj
          -scheme Downleaf
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DownleafDerivedData"
          CODE_SIGNING_ALLOWED=NO
          test-without-building
